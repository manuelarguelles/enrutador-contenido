name: E5 smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/cli.mjs index --records=examples/records --index=.data/e5-index.json --semantic=e5
      - run: node src/cli.mjs search --index=.data/e5-index.json --query="arquitectura de cache distribuida" --top-k=3
