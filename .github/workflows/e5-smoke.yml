name: E5 smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node src/cli.mjs index --records=examples/records --index=.data/e5-index.json --semantic=e5
      - run: node src/cli.mjs search --index=.data/e5-index.json --query="arquitectura de cache distribuida" --top-k=3
